<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>대 달무티</title><link rel="stylesheet" href="style.css"></head><body><main>
<section id="home" class="screen"><div class="hero"><div class="crown">♛</div><h1>대 달무티</h1><p>4–10인 실시간 카드게임</p></div><div class="panel"><label>닉네임<input id="name" maxlength="14" placeholder="이름 입력"></label><button id="create" class="primary">새 방 만들기</button><div class="or">또는</div><label>방 코드<input id="roomCode" maxlength="6" placeholder="예: A7K2P" autocapitalize="characters"></label><button id="join">방 코드로 참가</button><p class="hint">최대 10명까지 입장할 수 있습니다. 게임 중 입장자는 현재 판을 관전하고 다음 판에 대농노로 합류합니다.</p></div><section class="panel roomBrowser"><div class="roomBrowserHead"><h2>현재 방</h2><button id="refreshRooms" class="tiny">새로고침</button></div><div id="roomList" class="roomList"><div class="emptyRooms">방 목록을 불러오는 중입니다.</div></div></section></section>
<section id="lobby" class="screen hidden"><header><div><small>방 코드</small><strong id="code"></strong></div><span id="count"></span></header><div class="panel"><h2>참가자</h2><div id="lobbyPlayers"></div><p class="hint">4명 이상이면 방장이 언제든 게임을 시작할 수 있습니다.</p></div><section id="lobbyRules" class="panel rulebox"></section><div class="panel"><button id="start" class="primary hidden">현재 인원으로 게임 시작</button><button class="leave">방 나가기</button></div><section class="chatbox"><div id="chatLobby" class="chatlog"></div><div class="chatrow"><input class="chatInput" maxlength="120" placeholder="메시지 입력"><button class="chatSend">전송</button></div></section></section>
<section id="game" class="screen hidden"><header class="gameHead"><div><small id="handNo"></small><strong id="phase"></strong></div><div class="headActions"><div id="roomBadge"></div><button class="leave tiny">나가기</button></div></header><div id="status" class="status"></div><div id="players" class="players"></div><details class="ruleDetails" open><summary>게임 규칙</summary><div id="gameRules" class="rulebox"></div></details><section class="table"><div class="pileTitle">현재 묶음 <strong id="pileOwner"></strong></div><div id="pile" class="pile empty">새 묶음</div></section><section class="myarea"><div class="mytop"><h2>내 카드 <span id="handCount"></span></h2><button id="clear" class="tiny">선택 해제</button></div><div id="hand" class="hand"></div><div id="actions" class="actions"></div></section><section class="chatbox"><h3>채팅</h3><div id="chatGame" class="chatlog"></div><div class="chatrow"><input class="chatInput" maxlength="120" placeholder="메시지 입력"><button class="chatSend">전송</button></div></section><details><summary>최근 기록</summary><div id="logs" class="logs"></div></details></section><div id="toast" aria-live="polite"></div></main><script src="app.js"></script></body></html>
