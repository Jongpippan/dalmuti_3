<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>대 달무티</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="hand-ui.css"><link rel="stylesheet" href="player-ui.css"><link rel="stylesheet" href="feature-ui.css"></head><body><main>
<section id="home" class="screen"><div class="hero"><div class="crown">♛</div><h1>대 달무티</h1><p>4–10인 실시간 카드게임</p></div><div class="panel"><label>닉네임<input id="name" maxlength="14" placeholder="이름 입력"></label><span class="portraitLabel">초상화 선택</span><div id="portraitPicker" class="portraitPicker" aria-label="초상화 선택"></div><button id="create" class="primary">새 방 만들기</button><button id="testRoom">혼자 테스트 (봇 3명)</button><div class="or">또는</div><label>방 코드<input id="roomCode" maxlength="6" placeholder="예: A7K2P" autocapitalize="characters"></label><button id="join">방 코드로 참가</button><p class="hint">최대 10명까지 입장할 수 있습니다. 게임 중 입장자는 현재 판을 관전하고 다음 판에 대농노로 합류합니다. 테스트 방은 본인 + 봇 3명으로 즉시 시작됩니다.</p></div><section class="panel roomBrowser"><div class="roomBrowserHead"><h2>현재 방</h2><button id="refreshRooms" class="tiny">새로고침</button></div><div id="roomList" class="roomList"><div class="emptyRooms">방 목록을 불러오는 중입니다.</div></div></section></section>
<section id="lobby" class="screen hidden"><header><div><small>방 코드</small><strong id="code"></strong></div><span id="count"></span></header><div class="panel"><h2>참가자</h2><div id="lobbyPlayers"></div><p class="hint">4명 이상이면 방장이 언제든 게임을 시작할 수 있습니다.</p></div><section id="lobbyRules" class="panel rulebox"></section><section class="chatbox"><div id="chatLobby" class="chatlog"></div><div class="chatrow"><input class="chatInput" maxlength="120" placeholder="메시지 입력"><button class="chatSend">전송</button></div></section><details id="lobbyHostPanel" class="hostPanel hidden"><summary>방장 기능</summary><div class="hostPanelBody"><div class="hostStart"><button id="start" class="primary">현재 인원으로 게임 시작</button></div><div id="lobbyBotControls" class="botControls"></div><div id="lobbyChatModeControl"></div><div id="lobbyKickControls"></div></div></details><div class="panel"><button class="leave">방 나가기</button></div></section>
<section id="game" class="screen hidden"><header class="gameHead"><div><small id="handNo"></small><strong id="phase"></strong></div><div class="headActions"><div id="roomBadge"></div><button class="leave tiny">나가기</button></div></header><div id="status" class="status"></div><div id="players" class="players"></div><section class="table" id="dropZone"><div class="pileTitle">현재 묶음 <strong id="pileOwner"></strong></div><div id="pile" class="pile empty">새 묶음</div></section><section class="chatbox"><h3>채팅</h3><div id="chatGame" class="chatlog"></div><div class="chatrow"><input class="chatInput" maxlength="120" placeholder="메시지 입력"><button class="chatSend">전송</button></div></section><details class="ruleDetails"><summary>남는 카드 분배</summary><div id="gameRules" class="rulebox"></div></details><details id="gameHostPanel" class="hostPanel hidden"><summary>방장 기능</summary><div class="hostPanelBody"><div id="gameBotControls" class="botControls"></div><div id="gameChatModeControl"></div><div id="gameKickControls"></div></div></details><details><summary>최근 기록</summary><div id="logs" class="logs"></div></details><section id="myarea" class="myarea handDock"><div class="handTopRow"><div class="handHeadLeft"><div class="handTitle">내 패 <span id="handCount"></span></div><div class="sortBtns"><button id="sortRank" class="tiny sortBtn active">크기순</button><button id="sortCount" class="tiny sortBtn">카드 개수순</button></div></div><div class="handMainControls"><button id="clear" class="tiny">선택 해제</button><div id="actions" class="actions handActions"></div></div></div><div class="handSecondaryRow"><button id="roundRestBtn" class="tiny secondaryGameBtn hidden">이번 라운드 패스</button><button id="sleepBtn" class="tiny secondaryGameBtn hidden">잠자기</button><button id="aiPlayBtn" class="tiny secondaryGameBtn hidden">AI 플레이</button></div><div id="hand" class="hand fanHand"></div></section></section><div id="toast" aria-live="polite"></div></main><script src="app.js"></script><script src="hand-ui.js"></script><script src="card-corner.js"></script><script src="portrait-data.js"></script><script src="player-ui.js"></script><script src="portrait-ui.js"></script><script src="test-room.js"></script><script src="rest-ui.js"></script><script src="ai-ui.js"></script><script src="bot-ui.js"></script><script src="chat-mode-ui.js"></script><script src="host-ui.js"></script></body></html>
